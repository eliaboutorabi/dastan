<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta
			name="description"
			content="Dastan — a personal graded-reading app that turns your own life and interests into your language textbook."
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Literata:opsz,ital,wght@7..72,0,400;7..72,0,600;7..72,1,400&family=Vazirmatn:wght@400;500;700&display=swap"
			rel="stylesheet"
		/>
		<script>
			/*
			 * The LLM SDKs decide which runtime they are on by reading Node's
			 * `process` global, and several of those reads are not guarded. In a
			 * browser that throws a ReferenceError while the module is still
			 * evaluating, which takes the whole page down before anything renders.
			 *
			 * So `process` is provided here, deliberately without `versions.node` —
			 * that is the exact field those checks look for, so every one of them
			 * correctly concludes "not Node" and takes the browser path.
			 *
			 * This is a classic script, so it runs before any deferred module.
			 */
			window.process = window.process || {
				env: {},
				versions: {},
				platform: 'browser',
				argv: [],
				cwd: function () {
					return '/';
				}
			};
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
